# Despliegue continuo a la VM api-videos-prod.
#
# Hace exactamente lo que hacía `deploy-vps.sh` desde la laptop —empaquetar,
# copiar a la VM, construir la imagen allí y levantarla— con dos diferencias:
# lo ejecuta GitHub con una cuenta de servicio en vez de una sesión personal de
# gcloud, y antes vuelve a correr las pruebas. Un merge a main con las pruebas
# en verde es un despliegue; sin verde, no hay despliegue.
#
# El `.env.vps` con las llaves del servidor NO pasa por aquí: vive solo en la
# VM, igual que antes. Y GitHub tampoco guarda ninguna llave de GCP: se
# identifica con su propio token OIDC (Workload Identity Federation), que GCP
# acepta solo si viene de ESTE repositorio. La organización prohíbe crear
# llaves de cuenta de servicio, y aquí no hace falta ninguna.
#
# ---------------------------------------------------------------------------
# Lo que ya está hecho en GCP (14 sep 2026), por si hay que rehacerlo:
#
#   PROY=cmrg-505321  NUM=116567239332  REPO=gjuarez-ago/picale-api
#   SA=github-deploy@$PROY.iam.gserviceaccount.com
#   gcloud iam service-accounts create github-deploy --project=$PROY
#   gcloud projects add-iam-policy-binding $PROY --member="serviceAccount:$SA" \
#       --role="roles/compute.instanceAdmin.v1"        # scp, ssh, metadata
#   gcloud projects add-iam-policy-binding $PROY --member="serviceAccount:$SA" \
#       --role="roles/compute.osAdminLogin"            # la VM usa OS Login; sudo
#   gcloud iam service-accounts add-iam-policy-binding \
#       api-videos-vm@$PROY.iam.gserviceaccount.com --project=$PROY \
#       --member="serviceAccount:$SA" --role="roles/iam.serviceAccountUser"
#   gcloud iam workload-identity-pools create github --location=global --project=$PROY
#   gcloud iam workload-identity-pools providers create-oidc github-oidc \
#       --location=global --workload-identity-pool=github --project=$PROY \
#       --issuer-uri="https://token.actions.githubusercontent.com" \
#       --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
#       --attribute-condition="assertion.repository == '$REPO'"
#   gcloud iam service-accounts add-iam-policy-binding $SA --project=$PROY \
#       --role="roles/iam.workloadIdentityUser" \
#       --member="principalSet://iam.googleapis.com/projects/$NUM/locations/global/workloadIdentityPools/github/attribute.repository/$REPO"
#
# Lo único que falta para encenderlo, en GitHub → Settings del repo →
# Secrets and variables → Actions → Variables → New repository variable:
#
#     CD_ENABLED = true
#
# Mientras esa variable no exista, este flujo se salta en silencio: el repo
# puede vivir sin CD sin que cada push marque un fallo rojo.
# ---------------------------------------------------------------------------
name: Desplegar API

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos despliegues nunca a la vez: el segundo espera al primero. Cancelarlo a
# medias dejaría la VM con la imagen a medio construir.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  desplegar:
    name: Probar, construir en la VM y levantar
    if: ${{ vars.CD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: produccion

    # id-token: write es lo que le permite al job pedir su token OIDC, que es
    # con lo que GCP lo reconoce. Sin esto, auth@v2 falla sin llave que usar.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Aquí y no solo en ci.yml: los dos flujos arrancan a la vez con el push,
      # y este no debe depender de mirar si el otro terminó. Si falla, no se
      # toca producción.
      - name: Pruebas antes de tocar producción
        run: mvn -B --no-transfer-progress test

      # Sin llave: el job presenta su token OIDC y GCP lo deja actuar como
      # github-deploy solo si el token viene de este repositorio. El proveedor
      # no es un secreto —es un nombre de recurso— y por eso va aquí en claro.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/116567239332/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@cmrg-505321.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Desplegar en la VM
        env:
          # Sin preguntas: gcloud genera la llave SSH del runner sin pedir
          # frase, y todo lo demás asume "sí".
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          # La carpeta de la VM donde ya vive .env.vps. Desde GitHub el usuario
          # SSH es la cuenta de servicio, no la persona, así que "~" apuntaría
          # a otro home; el script la toma de aquí.
          DESTINO: /home/contacto_rodtech_cloud/metricol.api
        run: bash deploy-vps.sh
