# Picale detras de Cloudflare: el frontend y la API en UN solo dominio.
#
# Un dominio y no dos porque la propia app lo pide asi. En web, Constants.apiUrl
# es `/api/v1` —una ruta relativa, sin host— de modo que el build web solo
# funciona si algo sirve la API bajo el mismo origen desde el que se descargo.
# Partirlo en `picale` y `picale-api` obligaria a tocar ese codigo y a lidiar
# con CORS, y ademas gastaria dos certificados para lo mismo.
#
# De paso resuelve el retorno de upload-post: APP_BASE_URL apunta aqui, y
# `/social-connected.html` —la pagina puente que rebota a `pulso://`— es un
# archivo mas del build web, servido por este mismo bloque.
#
# El movil usa este mismo dominio con host completo:
#   flutter run --dart-define=API_BASE=https://picale.rodtech.cloud
#
# Va en /etc/nginx/sites-available/picale.conf con enlace en sites-enabled.
# Convive con direccion360.conf porque nginx elige por server_name.

server {
    listen 80;
    listen [::]:80;
    server_name picale.rodtech.cloud;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` y no la directiva `http2 on` de nginx 1.25: esta
    # maquina lleva la 1.24, donde esa forma ni existe y tumba el arranque.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name picale.rodtech.cloud;

    # Certificado del origen. Con el proxy de Cloudflare encendido, el reto
    # HTTP-01 de certbot no llega hasta aqui —lo contesta Cloudflare— asi que
    # se usa un certificado de origen y el SSL/TLS del dominio en "Full".
    #
    # Nunca "Flexible": ahi Cloudflare hablaria HTTP con este servidor y los
    # JWT de las sesiones viajarian en claro en ese tramo.
    ssl_certificate     /etc/ssl/picale/origen.pem;
    ssl_certificate_key /etc/ssl/picale/origen.key;

    root /var/www/picale;
    index index.html;

    # Subidas del panel web. El tope real lo pone Cloudflare —100 MB en los
    # planes sin pago— asi que subir de aqui no sirve de nada. Los medios de
    # las publicaciones no pasan por este camino: van directos a R2 con una URL
    # firmada, y por eso este limite no estorba.
    client_max_body_size 100m;

    # La API, bajo el mismo origen que el frontend.
    location /api/ {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare corta a los 100 s con un 524, asi que pasar de ahi no gana
        # nada. Publicar no se ve afectado: la peticion solo encola y contesta,
        # y quien habla con las redes es un worker de fondo.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }

    # Los medios servidos por la API para el panel. Va aparte de /api/ porque
    # SecurityConfig lo deja publico bajo /media/files/**, fuera del prefijo.
    location /media/ {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El build web de Flutter. `try_files` acaba en index.html porque es una
    # sola pagina: recargar en /calendario debe devolver la app, no un 404 de
    # nginx buscando una carpeta que no existe.
    # Los puntos de entrada del build web, fuera de la cache del borde.
    #
    # Sus nombres nunca cambian —main.dart.js es siempre main.dart.js— y
    # Cloudflare cachea .js por extension, asi que tras un despliegue siguio
    # sirviendo el bundle anterior durante horas, y encima mezclado: el
    # flutter_bootstrap.js nuevo junto al main.dart.js viejo. Lo que lleva hash
    # en el nombre (assets, canvaskit) se sigue cacheando, que es donde esta el
    # peso de verdad.
    location ~ ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
