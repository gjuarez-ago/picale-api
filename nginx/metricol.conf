# Picale detras de Cloudflare: el frontend y la API en UN solo dominio.
#
# El frontend es el sitio de Angular (metricol_web): portada, paginas legales
# y panel. Antes aqui vivia el build web de Flutter, de cuando la app movil
# tambien se compilaba para navegador; hoy Flutter es solo movil y el web es
# Angular.
#
# Un dominio y no dos porque asi la API queda en el mismo origen que el panel
# y no hay CORS que lidiar, y ademas gasta un solo certificado.
#
# De paso resuelve el retorno de upload-post: APP_BASE_URL apunta aqui, y
# `/social-connected.html` —la pagina puente que rebota a `pulso://`— es un
# archivo mas del sitio, servido por este mismo bloque.
#
# El movil usa este mismo dominio con host completo:
#   flutter run --dart-define=API_BASE=https://picale.rodtech.cloud
#
# Va en /etc/nginx/sites-available/picale.conf con enlace en sites-enabled.
# Convive con direccion360.conf porque nginx elige por server_name.

server {
    listen 80;
    listen [::]:80;
    server_name picale.rodtech.cloud;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` y no la directiva `http2 on` de nginx 1.25: esta
    # maquina lleva la 1.24, donde esa forma ni existe y tumba el arranque.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name picale.rodtech.cloud;

    # Certificado del origen. Con el proxy de Cloudflare encendido, el reto
    # HTTP-01 de certbot no llega hasta aqui —lo contesta Cloudflare— asi que
    # se usa un certificado de origen y el SSL/TLS del dominio en "Full".
    #
    # Nunca "Flexible": ahi Cloudflare hablaria HTTP con este servidor y los
    # JWT de las sesiones viajarian en claro en ese tramo.
    ssl_certificate     /etc/ssl/picale/origen.pem;
    ssl_certificate_key /etc/ssl/picale/origen.key;

    root /var/www/picale;
    index index.html;

    # Subidas del panel web. El tope real lo pone Cloudflare —100 MB en los
    # planes sin pago— asi que subir de aqui no sirve de nada. Los medios de
    # las publicaciones no pasan por este camino: van directos a R2 con una URL
    # firmada, y por eso este limite no estorba.
    client_max_body_size 100m;

    # La API, bajo el mismo origen que el frontend.
    location /api/ {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare corta a los 100 s con un 524, asi que pasar de ahi no gana
        # nada. Publicar no se ve afectado: la peticion solo encola y contesta,
        # y quien habla con las redes es un worker de fondo.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }

    # Los medios servidos por la API para el panel. Va aparte de /api/ porque
    # SecurityConfig lo deja publico bajo /media/files/**, fuera del prefijo.
    location /media/ {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los dos archivos sin hash en el nombre, fuera de la cache del borde.
    #
    # index.html es el que decide que bundle se carga. Con Cloudflare
    # cacheandolo, un despliegue seguia sirviendo el index anterior durante
    # horas, apuntando a chunks que ya no existian. Todo lo demas que emite
    # Angular lleva hash y se cachea sin riesgo, que es donde esta el peso.
    #
    # social-connected.html es el puente que devuelve el movil a la app tras
    # conectar una red. Se sirve como archivo suelto, antes de que `try_files`
    # caiga al index, y cachearlo dejaria clavada una version del rebote.
    location ~ ^/(index\.html|social-connected\.html)$ {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # El sitio es una sola pagina: recargar en /panel/calendario debe devolver
    # la app para que el router de Angular resuelva la ruta, no un 404 de nginx.
    #
    # Cae en app-shell.html y NO en index.html: index.html es la portada ya
    # prerenderizada, y servirla en /panel/... enseñaba la portada (y luego el
    # login) un instante antes de que Angular arrancara. app-shell.html es la
    # misma app sin contenido pintado; lo genera scripts/aplanar-prerender.mjs.
    #
    # `$uri.html` va antes del index a proposito: el build prerenderiza la
    # portada y las paginas legales (privacidad.html, terminos.html,
    # eliminar-cuenta.html). Sin esta linea nginx caeria al index y Google
    # recibiria una pagina vacia que rellena JavaScript, que es justo lo que
    # el prerender viene a evitar.
    location / {
        try_files $uri $uri.html $uri/ /app-shell.html;
    }
}
