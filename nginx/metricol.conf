# Picale: SOLO la API, detras de Cloudflare.
#
# El sitio (portada, paginas legales y panel de Angular) ya no vive aqui: se
# sirve desde Cloudflare Pages en https://picale.click. El panel le pide
# /api/... y /media/... a picale.click, y una funcion de Pages (metricol_web/
# functions/) lleva esas peticiones a este servidor. La app movil le pega a este
# dominio directamente. Por eso aqui solo quedan /api/ y /media/.
#
# Todo lo demas se manda con un 301 a picale.click, con la misma ruta: quien
# tenga guardado un enlace viejo (por ejemplo la politica de privacidad o
# /social-connected.html) cae en el sitio nuevo sin darse cuenta.
#
# El sitio anterior sigue en disco (/var/www/picale y /var/www/picale.anterior);
# nada se borra. Para volver atras: restaurar el conf anterior que guarda
# cutover-picale-click.sh (picale.conf.antes-cutover-*).
#
# Va en /etc/nginx/sites-available/picale.conf con enlace en sites-enabled.
# Convive con direccion360.conf porque nginx elige por server_name.

server {
    listen 80;
    listen [::]:80;
    server_name picale.rodtech.cloud;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` y no la directiva `http2 on` de nginx 1.25: esta
    # maquina lleva la 1.24, donde esa forma ni existe y tumba el arranque.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name picale.rodtech.cloud;

    # Certificado del origen. Con el proxy de Cloudflare encendido, el reto
    # HTTP-01 de certbot no llega hasta aqui —lo contesta Cloudflare— asi que
    # se usa un certificado de origen y el SSL/TLS del dominio en "Full".
    #
    # Nunca "Flexible": ahi Cloudflare hablaria HTTP con este servidor y los
    # JWT de las sesiones viajarian en claro en ese tramo.
    ssl_certificate     /etc/ssl/picale/origen.pem;
    ssl_certificate_key /etc/ssl/picale/origen.key;

    # Subidas del panel web (pasan por la funcion de Pages y llegan aqui). El
    # tope real lo pone Cloudflare —100 MB en los planes sin pago— asi que
    # subir de aqui no sirve de nada. Los medios de las publicaciones no pasan
    # por este camino: van directos a R2 con una URL firmada.
    client_max_body_size 100m;

    # La API.
    location /api/ {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare corta a los 100 s con un 524, asi que pasar de ahi no gana
        # nada. Publicar no se ve afectado: la peticion solo encola y contesta,
        # y quien habla con las redes es un worker de fondo.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }

    # Los medios servidos por la API. Va aparte de /api/ porque SecurityConfig
    # lo deja publico bajo /media/files/**, fuera del prefijo.
    location /media/ {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo que no es API: al sitio nuevo, con la misma ruta y sus parametros.
    # 301 y no 302: es un cambio de casa definitivo, y asi los buscadores y los
    # enlaces guardados se actualizan.
    location / {
        return 301 https://picale.click$request_uri;
    }
}
