spring:
  config:
    activate:
      on-profile: prod

  # Base de datos gestionada. Sin defaults: en produccion una variable que
  # falta tiene que impedir el arranque, no arrastrar un valor de desarrollo.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    # Pool chico a proposito: la base gestionada tiene un tope de conexiones
    # que se reparte entre todas las instancias, y el API escala por replicas.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      max-lifetime: 1800000      # 30 min, recicla conexiones obsoletas
      connection-timeout: 30000  # 30 s esperando una conexion libre
      idle-timeout: 600000       # 10 min para soltar las inactivas
      keepalive-time: 300000     # 5 min, mantiene vivo el socket

  # `update` y no `validate`: conserva los datos entre despliegues y solo
  # aplica los cambios incrementales de esquema.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  # Correo saliente (Resend por SMTP). Sin llave, los codigos de recuperacion no salen y la recuperacion queda muerta en produccion.
  # El usuario SMTP de Resend es literalmente "resend". Los topes y el TLS son
  # iguales en todos los ambientes y viven en application.properties.
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}

app:
  # Obligatorio: el default de application.properties abre localhost y los
  # tuneles de ngrok, que en produccion seria dejar la puerta abierta.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # A donde vuelve el navegador despues de conectar una red en upload-post.com.
  # Sin default: si apunta a localhost, el usuario acaba en una pagina muerta.
  base-url: ${APP_BASE_URL}
  # Cobros con Stripe (ver StripeProperties). Sin llaves = cobros apagados: la app
  # funciona igual y no se le cobra a nadie.
  # Llaves de ESTE ambiente, solo en el .env.vps del servidor (este repositorio puede
  # ser publico): sk_live_ y whsec_ del webhook de produccion. Con una sk_test_ el
  # dinero es de mentira; el modo lo dice la propia llave.
  # Los productos y precios NO se crean a mano: la API crea los productos en
  # Stripe al vender y el monto sale de la tabla billing_settings.
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  # OJO: el default es el dominio que hoy SIRVE el sitio (picale.rodtech.cloud). Antes era picale.click, que
  # todavia no resuelve: las invitaciones y el regreso de Stripe apuntaban a una pagina muerta. Cuando
  # picale.click este vivo, se cambia con la variable WEB_URL, sin tocar el codigo.
  # El sitio web publico (Angular), que NO es lo mismo que base-url: aquella es
  # donde vive el puente de regreso a la app movil. Esta es donde estan las
  # pantallas que se abren desde un correo, como aceptar una invitacion.
  web-url: ${WEB_URL:https://picale.rodtech.cloud}
  # Llave de los endpoints de operacion (/api/v1/ops/**), en la cabecera
  # X-Ops-Key. Vacia = esos endpoints contestan 404, como si no existieran.
  ops:
    api-key: ${OPS_API_KEY:}
  # Cuenta de demostracion para la revision de Google Play (DemoAccountInitializer).
  # Vacias = no se crea nada. Los valores viven SOLO en el .env.vps del servidor: este repositorio puede ser publico y una contrasena escrita aqui seria la de una cuenta real.
  demo:
    email: ${DEMO_ACCOUNT_EMAIL:}
    password: ${DEMO_ACCOUNT_PASSWORD:}
    organization: ${DEMO_ACCOUNT_ORGANIZATION:Picale HUB}
    # WhatsApp de la marca de la cuenta raiz (opcional): del servidor, no del codigo, que es publico.
    whatsapp: ${DEMO_ACCOUNT_WHATSAPP:}
    # true = la cuenta demo es la CUENTA RAIZ (sin limites ni vigencia, con la marca de Picale).
    # Sin esta linea la variable del servidor no llegaba a @Value("${app.demo.root}") y la cuenta
    # nacia como una demo normal.
    root: ${DEMO_ACCOUNT_ROOT:false}
  # Solo la direccion del remitente; el nombre visible ("Picale") lo pone
  # EmailService. Tiene que ser de un dominio verificado en Resend.
  mail:
    from: ${MAIL_FROM:notificaciones@rodtech.cloud}

# Cadena larga y aleatoria, propia de este entorno. Cambiarla invalida todas
# las sesiones abiertas.
jwt:
  secret: ${JWT_SECRET}
  expiration-days: ${JWT_EXPIRATION_DAYS:15}

# Medios de las publicaciones. Aqui no hay secretos en el repositorio: las
# cinco llegan por variable de entorno y sin ellas el arranque falla.
cloudflare:
  r2:
    endpoint: ${CLOUDFLARE_R2_ENDPOINT}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY_ID}
    secret-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
    bucket: ${CLOUDFLARE_R2_BUCKET_NAME}
    public-url: ${CLOUDFLARE_R2_PUBLIC_URL}

# Publicacion real en redes. Vacio de fabrica y no obligatorio: sin llave,
# conectar una red avisa que no esta configurado (isConfigured lo cubre) y el
# resto de la plataforma sigue en pie. Se puede desplegar una version que
# todavia no publica sin inventar una llave para que el servidor levante.
uploadpost:
  api-key: ${UPLOAD_POST_API_KEY:}
  base-url: ${UPLOAD_POST_BASE_URL:https://api.upload-post.com/api}

# OpenAI: texto de las publicaciones y campañas de imagen. Sin llave la aplicacion
# levanta igual y solo la IA queda apagada (OpenAiProperties.isConfigured).
# Los defaults de imagen y de director son los modelos y precios verificados en produccion (developers.openai.com/api/docs/pricing); el .env.vps los puede pisar.
# Los precios son dolares por millon de tokens y con ellos se calcula el costo de
# cada llamada en ai_usage; en 0 se cuentan los tokens pero el costo sale en cero.
# Si se cambia de modelo hay que cambiar tambien su precio.
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_API_MODEL:gpt-4o-mini}
  pricing:
    input-usd-per-million: ${OPENAI_PRICING_INPUT_PER_1M_USD:0}
    output-usd-per-million: ${OPENAI_PRICING_OUTPUT_PER_1M_USD:0}
  # Imagenes de campana (POST /campaign-images/generate). El modelo debe estar
  # permitido en el proyecto de OpenAI.
  image-model: ${OPENAI_IMAGE_MODEL:gpt-image-2}
  # Fidelidad a las fotos de referencia (high/low; vacio = no se manda).
  image-input-fidelity: ${OPENAI_IMAGE_INPUT_FIDELITY:}
  # Director de arte: mira las fotos y arma el plan. Si falla o tarda mas de lo
  # indicado, la campana sigue sin el con el prompt de siempre.
  director-model: ${OPENAI_DIRECTOR_MODEL:gpt-5-mini}
  director-reasoning-effort: ${OPENAI_DIRECTOR_REASONING_EFFORT:low}
  director-timeout-seconds: ${OPENAI_DIRECTOR_TIMEOUT_SECONDS:25}
  director-pricing:
    input-usd-per-million: ${OPENAI_DIRECTOR_PRICING_INPUT_PER_1M_USD:0.25}
    output-usd-per-million: ${OPENAI_DIRECTOR_PRICING_OUTPUT_PER_1M_USD:2.00}
  image-pricing:
    input-usd-per-million: ${OPENAI_IMAGE_PRICING_INPUT_PER_1M_USD:8.00}
    output-usd-per-million: ${OPENAI_IMAGE_PRICING_OUTPUT_PER_1M_USD:30.00}

# Entrar con Google. Va el client id del cliente WEB, NO el de Android (el token
# viene dirigido al cliente web: es su audience). El mismo valor va en la app
# como serverClientId. Vacio = login con Google apagado; entrar con correo y
# contrasena sigue igual.
google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

server:
  # `PORT` porque es lo que inyecta Cloud Run; 8080 si se despliega a mano.
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework: INFO
    com.metricol.api: INFO
