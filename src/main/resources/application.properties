spring.application.name=metricol-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:./.env[.properties]

# ---------------------------------------------------------------------------
# Que vive aqui y que no
# ---------------------------------------------------------------------------
# AQUI va lo que es igual en todos los ambientes: limites, colas, cuotas de las
# redes, medios, formatos. Son caracteristicas de la plataforma, no del entorno.
#
# Lo que cambia de un ambiente a otro NO va aqui, va en su perfil
# (application-dev.yml, application-qa.yml, application-prod.yml): la base de
# datos, el dialecto, el JWT, CORS, las URLs, las llaves de R2, OpenAI,
# upload-post, Resend, Google y Stripe, la llave de operacion y la cuenta de
# demostracion. Asi ningun default de desarrollo se cuela en produccion, y una
# llave de un ambiente nunca vale en otro.

spring.jpa.properties.hibernate.tenant_identifier_resolver=com.metricol.api.config.TenantIdentifierResolver

# Lo que identifica nuestros tokens; el secreto y la vigencia son de cada perfil.
jwt.issuer=metricol-api
jwt.audience=metricol-app

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Cuanto video acepta cada red, en segundos. Van aqui y no por perfil porque
# es una caracteristica de la red, no del entorno: el tope de TikTok es el
# mismo en dev que en produccion.
#
# Son una guia para avisar antes de subir, no la autoridad: la red decide, y
# si rechaza el video el motivo acaba en PostTarget.errorMessage. Se ajustan
# por variable de entorno cuando una red mueve su tope, sin desplegar.
#
# Limites de Upload-Post: Facebook usa VIDEO cuando supera 90 s.
# https://docs.upload-post.com/api/video-requirements/
app.video.max-seconds.instagram=${VIDEO_MAX_INSTAGRAM:900}
app.video.max-seconds.tiktok=${VIDEO_MAX_TIKTOK:600}
app.video.max-seconds.facebook=${VIDEO_MAX_FACEBOOK:14400}
app.video.max-seconds.linkedin=${VIDEO_MAX_LINKEDIN:1800}
app.video.max-seconds.youtube=${VIDEO_MAX_YOUTUBE:43200}

# Cuanto PESA el video que acepta cada red, en bytes. Misma naturaleza que los
# segundos de arriba: lo pone la red, es una guia para avisar antes de subir, y
# se ajusta por variable de entorno cuando una red mueve su tope.
#
# De https://docs.upload-post.com/api/video-requirements/ :
#   Instagram feed y reels 300 MB (las HISTORIAS solo 100 MB: eso no es de la
#     red sino del formato, y va en FormatRulesService)
#   LinkedIn 500 MB
#   TikTok 3 GB — upload-post rechaza por encima de eso con
#     error_code=invalid_video_file, aunque TikTok diga 4 GB
#   Facebook 10 GB
#   YouTube 256 GB
#
# Son mas altos que app.media.max-file-bytes a proposito: ese es cuanto
# guardamos nosotros, estos son cuanto acepta cada destino. El primero decide
# si el archivo entra; estos deciden a QUE REDES puede ir una vez dentro.
app.video.max-bytes.instagram=${VIDEO_MAX_BYTES_INSTAGRAM:314572800}
app.video.max-bytes.linkedin=${VIDEO_MAX_BYTES_LINKEDIN:524288000}
app.video.max-bytes.tiktok=${VIDEO_MAX_BYTES_TIKTOK:3221225472}
app.video.max-bytes.facebook=${VIDEO_MAX_BYTES_FACEBOOK:10737418240}
app.video.max-bytes.youtube=${VIDEO_MAX_BYTES_YOUTUBE:274877906944}

# ---------------------------------------------------------------------------
# Formatos de publicacion (FormatRulesService)
#
# La tabla de reglas por formato: cuantas fotos caben y cuanto puede durar un
# video. Las lee la validacion del servidor Y la pantalla, por
# GET /publishing/formats, para que no haya dos respuestas a la misma pregunta.
#
# Seis fotos porque es lo que la app ya aplicaba, y es el numero mas bajo de
# todos los que admiten las redes: quedarse corto no cuesta nada, pasarse
# cuesta la publicacion.
app.post.max-photos=${POST_MAX_PHOTOS:6}

# Publicaciones programadas. Las busca y publica ScheduledPostWorker.
#
# Cada minuto: una publicacion en redes no necesita salir al segundo exacto, y
# a cambio el retraso maximo es de un minuto, que nadie nota.
#
# El lote ya NO es el tope de concurrencia: este worker solo encola, y quien
# reparte el trabajo entre workers es app.publishing.queue de mas abajo. Aqui
# es solo cuantas filas se recogen de golpe tras un rezago largo, y por eso
# puede ser generoso.
app.scheduling.poll-delay-ms=${SCHEDULING_POLL_DELAY_MS:60000}
app.scheduling.batch-size=${SCHEDULING_BATCH_SIZE:200}

# ---------------------------------------------------------------------------
# Organizaciones: cuantos espacios de trabajo (clientes) caben en una
# ---------------------------------------------------------------------------
# Hoy los espacios son gratis, asi que el tope es holgado: esta aqui para que
# nadie cree doscientos por error o a proposito. Cada espacio crea su propio
# perfil en upload-post, y upload-post cobra por perfil, asi que el numero no
# es una traba comercial sino un freno de gasto.
#
# Es solo el valor de partida: se guarda en cada organizacion al crearla, y a
# una se le puede ampliar sin tocar esto ni afectar a las demas. El dia que se
# cobre por espacio, este es el numero que cambia.
app.organizations.max-workspaces=${ORG_MAX_WORKSPACES:10}

# ---------------------------------------------------------------------------
# Contenido: cuanto cabe por publicacion y por workspace
# ---------------------------------------------------------------------------
# Fotos por publicacion (carrusel). El video siempre va solo.
app.media.max-images-per-post=${MEDIA_MAX_IMAGES_PER_POST:6}
# Tope de un archivo suelto, para el camino normal: el presign. Ahi el archivo
# va del telefono o del navegador DIRECTO a R2 y nunca pasa por nuestro
# servidor, asi que ni spring.servlet.multipart ni client_max_body_size de
# nginx lo limitan. El unico tope es este.
#
# 500 MB (2026-10-19; antes 100 MB). Los 100 MB eran el tope de Instagram para
# HISTORIAS, el numero mas bajo de todas las redes, aplicado a todo: un video
# de 200 MB para TikTok —que acepta 3 GB— no se podia ni subir. Ahora el peso
# se comprueba por red (app.video.max-bytes de arriba), igual que la duracion:
# un archivo de 400 MB entra, y las redes que no lo aguanten se quedan fuera
# de esa publicacion en vez de bloquearla entera.
#
# 500 MB porque es el tope de LinkedIn, la red mas estricta por encima de
# Instagram: por debajo de eso no se guarda nada que no pueda ir a ningun
# sitio. Subirlo mas solo tiene sentido para TikTok, Facebook o YouTube.
app.media.max-file-bytes=${MEDIA_MAX_FILE_BYTES:524288000}
# Tope del camino VIEJO, el de subir por multipart a traves de la API
# (POST /media/upload). Hoy solo lo usa la herramienta subir_archivo del MCP,
# con archivos pequenos que manda el modelo.
#
# Es mas bajo que el de arriba y tiene que serlo: esa peticion si cruza nginx
# (client_max_body_size 100m en nginx/metricol.conf) y el multipart de Spring,
# y pasarse ahi no da nuestro mensaje sino un 413 seco del proxy. Si algun dia
# se sube, hay que subir los tres a la vez.
app.media.max-upload-bytes=${MEDIA_MAX_UPLOAD_BYTES:104857600}
# Espacio total por workspace. R2 cobra por lo almacenado, asi que sin un
# tope por cuenta el costo de un solo usuario entusiasta no tiene techo.
#
# 50 GB por espacio (2026-10-19; antes 10 GB, y 1 GB antes de eso). Sube con
# el tope por archivo: con videos de hasta 500 MB, 10 GB se agotaban en veinte
# archivos y la biblioteca dejaba de ser una biblioteca. A precio de R2 son
# centavos por espacio al mes, y solo se paga lo que de verdad se guarda.
#
# En la VM se puede cambiar sin desplegar con MEDIA_MAX_BYTES_PER_WORKSPACE en
# .env.vps y recreando el contenedor. Un 0 lo desactiva.
app.media.max-bytes-per-workspace=${MEDIA_MAX_BYTES_PER_WORKSPACE:53687091200}

# Asistente operativo: identidad corta API -> MCP. La misma llave debe estar
# en picale-mcp; vacia mantiene desactivadas las llamadas internas.
app.assistant.delegation-key=${ASSISTANT_DELEGATION_KEY:}
app.assistant.mcp-url=${ASSISTANT_MCP_URL:https://mcp.picale.click/mcp}
# Carga masiva: cuántos archivos al día por espacio (0 = sin tope), y cuántos por tanda en la web.
app.media.max-subidas-por-dia=${MEDIA_MAX_SUBIDAS_POR_DIA:100}
app.media.max-por-tanda=${MEDIA_MAX_POR_TANDA:20}
app.media.max-videos-por-tanda=${MEDIA_MAX_VIDEOS_POR_TANDA:5}

# ---------------------------------------------------------------------------
# Reels derivados de fotografías
# ---------------------------------------------------------------------------
# Apagado hasta que el cliente consuma la API de propuesta y aprobación.
app.reels.enabled=${REELS_ENABLED:false}
# La cola real vive en reel_render_jobs; el executor no guarda espera en RAM.
app.reels.workers=${REELS_WORKERS:1}
app.reels.poll-delay-ms=${REELS_POLL_DELAY_MS:2000}
app.reels.rescue-delay-ms=${REELS_RESCUE_DELAY_MS:120000}
app.reels.batch-size=${REELS_BATCH_SIZE:5}
app.reels.max-attempts=${REELS_MAX_ATTEMPTS:3}
app.reels.retry-base-seconds=${REELS_RETRY_BASE_SECONDS:30}
app.reels.retry-max-seconds=${REELS_RETRY_MAX_SECONDS:300}
app.reels.stale-after-seconds=${REELS_STALE_AFTER_SECONDS:600}
app.reels.timeout-seconds=${REELS_TIMEOUT_SECONDS:240}
app.reels.ffmpeg=${FFMPEG_PATH:ffmpeg}
app.reels.ffprobe=${FFPROBE_PATH:ffprobe}
app.reels.min-photos=4
app.reels.max-photos=8
app.reels.min-duration-seconds=15
app.reels.max-duration-seconds=30
app.reels.default-duration-seconds=${REELS_DEFAULT_DURATION_SECONDS:20}
app.reels.recipe-version=photos-v1

# Director creativo automático: despliegue gradual; no publica nunca por sí solo.
app.creative-director.enabled=${CREATIVE_DIRECTOR_ENABLED:false}
app.creative-director.workers=${CREATIVE_DIRECTOR_WORKERS:1}
app.creative-director.poll-delay-ms=${CREATIVE_DIRECTOR_POLL_DELAY_MS:2000}
app.creative-director.rescue-delay-ms=${CREATIVE_DIRECTOR_RESCUE_DELAY_MS:60000}
app.creative-director.batch-size=${CREATIVE_DIRECTOR_BATCH_SIZE:5}
app.creative-director.max-attempts=${CREATIVE_DIRECTOR_MAX_ATTEMPTS:3}
app.creative-director.timeout-seconds=${CREATIVE_DIRECTOR_TIMEOUT_SECONDS:75}
app.creative-director.stale-after-seconds=${CREATIVE_DIRECTOR_STALE_AFTER_SECONDS:180}
app.creative-director.retry-base-seconds=${CREATIVE_DIRECTOR_RETRY_BASE_SECONDS:15}
app.creative-director.retry-max-seconds=${CREATIVE_DIRECTOR_RETRY_MAX_SECONDS:120}
app.creative-director.recipe-version=creative-plan-v1

# ---------------------------------------------------------------------------
# Cola de publicacion
# ---------------------------------------------------------------------------
# Workers que publican en paralelo. Es tambien el tope de llamadas
# simultaneas a upload-post, y tiene que caber en el pool de conexiones de la
# base: en prod son 5 (ver application-prod.yml), asi que subir esto de 8 sin
# subir aquel solo cambia donde se hace la cola.
app.publishing.queue.workers=${PUBLISH_WORKERS:8}
# Cada cuanto el despachador busca trabajo. Corto a proposito: es una
# consulta con indice, y de esto depende cuanto tarda en salir un "publicar
# ahora".
app.publishing.queue.poll-delay-ms=${PUBLISH_POLL_DELAY_MS:2000}
app.publishing.queue.batch-size=${PUBLISH_BATCH_SIZE:25}
# Intentos totales por publicacion, con espera que se duplica: 30s, 1m, 2m...
app.publishing.queue.max-attempts=${PUBLISH_MAX_ATTEMPTS:4}
app.publishing.queue.retry-base-seconds=${PUBLISH_RETRY_BASE_SECONDS:30}
app.publishing.queue.retry-max-seconds=${PUBLISH_RETRY_MAX_SECONDS:900}
# Tras cuanto un trabajo tomado se da por abandonado y vuelve a la cola.
# Cubre el proceso que se murio publicando: sin esto esa publicacion se
# quedaria tomada para siempre y nadie volveria a mirarla.
app.publishing.queue.stale-after-seconds=${PUBLISH_STALE_AFTER_SECONDS:600}
app.publishing.queue.rescue-delay-ms=${PUBLISH_RESCUE_DELAY_MS:120000}

# ---------------------------------------------------------------------------
# Cuota diaria por red (publicaciones al dia y por cuenta)
# ---------------------------------------------------------------------------
# OJO: desde que existe la tabla app_limits, estos valores son SEMILLA. Llenan
# la tabla la primera vez que arranca la aplicacion y no vuelven a tocar una
# fila que ya exista. Para cambiar un tope en produccion:
#   update app_limits set valor = 30, updated_at = now() where clave = 'quota.daily.INSTAGRAM';
# y en medio minuto lo lee todo el mundo, sin desplegar. Ver LimitesConfigurables.
#
# Facebook a 25 y no a 50: upload-post documenta "25 posts per rolling 24 hours
# per Page". El 50 anterior dejaba pedir el doble de lo que Facebook acepta.
# Estos topes los pone el proveedor, no esta plataforma. La API de contenido
# de Instagram admite 25 publicaciones cada 24 horas por cuenta; el resto son
# cifras conservadoras de sus limites publicados. Pasarse no da un error
# amable: la red empieza a rechazar todo y la aplicacion se queda marcada.
#
# Cuando una red se agota la publicacion no falla: se aplaza al dia siguiente
# (PublishJobStatus.DEFERRED). Un 0 significa "sin tope conocido".
app.quota.daily.instagram=${QUOTA_DAILY_INSTAGRAM:25}
app.quota.daily.facebook=${QUOTA_DAILY_FACEBOOK:25}
app.quota.daily.tiktok=${QUOTA_DAILY_TIKTOK:15}
app.quota.daily.youtube=${QUOTA_DAILY_YOUTUBE:10}
app.quota.daily.linkedin=${QUOTA_DAILY_LINKEDIN:150}
# De madrugada, cuando no hay nada que estorbar: borra los contadores de dias
# pasados, que ya no se consultan para decidir.
app.quota.cleanup-cron=${QUOTA_CLEANUP_CRON:0 20 3 * * *}

# ---------------------------------------------------------------------------
# Subida directa a R2 (la app sube al bucket, no a traves de la API)
# ---------------------------------------------------------------------------
# Cuanto vale una URL firmada. Media hora y no cinco minutos porque la sube un
# telefono: 100 MB por una red mala tardan mas de lo que nadie espera, y una
# URL vencida a mitad de subida obliga a empezar de nuevo.
app.media.presign-ttl-seconds=${MEDIA_PRESIGN_TTL_SECONDS:1800}

# Cuando se da por abandonada una subida prefirmada que nadie confirmo.
#
# Tiene que ser holgadamente mayor que el TTL de arriba: mientras la URL sigue
# valiendo, la subida todavia puede estar en curso, y darla por muerta antes
# borraria la fila de un archivo que esta llegando.
#
# Lo que hace la revision (MediaOrphanWorker): si el archivo SI esta en R2 lo
# confirma con su tamano real —se perdio la llamada de confirmar, no la
# subida—; si no esta, borra la fila y devuelve el espacio apartado. Sin esto,
# cada subida interrumpida dejaria cuota apartada para siempre.
app.media.orphan-after-minutes=${MEDIA_ORPHAN_AFTER_MINUTES:60}
app.media.orphan-delay-ms=${MEDIA_ORPHAN_DELAY_MS:900000}
app.media.orphan-batch-size=${MEDIA_ORPHAN_BATCH_SIZE:100}

# El otro cabo suelto de la subida optimista: archivos YA confirmados que
# ninguna publicacion usa. Pasa cuando el POST /posts falla despues de subir,
# o cuando alguien se arrepiente y cierra la pantalla. La revision de arriba no
# los ve —esa mira los PENDING, y estos estan READY— y hasta ahora se quedaban
# ocupando cuota para siempre, sin salir en ninguna publicacion que la persona
# pudiera borrar.
#
# Tres dias y no una hora. La foto de alguien que esta componiendo sin prisa no
# se distingue de una abandonada mas que por el tiempo, y los dos errores no
# cuestan lo mismo: esperar de mas ocupa unos megas unos dias, y borrar de mas
# tira el trabajo de otro. La captura sube en cuanto se elige la foto, asi que
# el reloj corre mientras la persona todavia escribe, y una app que paso la
# noche en segundo plano tiene que poder publicar al dia siguiente.
#
# Los borradores nunca corren peligro: sus URLs estan en post_media desde que
# se guardan, asi que cuentan como usadas.
app.media.unused-after-hours=${MEDIA_UNUSED_AFTER_HOURS:72}
app.media.unused-delay-ms=${MEDIA_UNUSED_DELAY_MS:3600000}
app.media.unused-batch-size=${MEDIA_UNUSED_BATCH_SIZE:100}

# Cuando se devuelve el espacio de un VIDEO que ya se publico.
#
# Era el agujero grande: lo que se subia no salia nunca. Las dos limpiezas de
# arriba cubren lo que no llego a usarse, pero lo que SI se publico se quedaba
# para siempre, y con videos de hasta 100 MB una cuenta se llenaba en dos
# publicaciones sin nada que la persona pudiera borrar sin perder su historial.
#
# Solo videos: una foto pesa mil veces menos y es material que se reutiliza.
# Un video se graba para una publicacion concreta, y cuando sale cada red
# guarda su copia — la nuestra a partir de ahi solo cuesta.
#
# No se borra la fila ni la miniatura, asi que la publicacion se sigue viendo
# con su portada y el boton de verla lleva a la red. Lo unico que desaparece es
# el archivo.
#
# 30 dias: margen de sobra para republicarlo en otra red o descargarlo, y
# pasado un mes casi nadie vuelve al original. Un 0 lo apaga por completo.
#
# Nunca toca un video que este en una publicacion sin salir: el mismo archivo
# puede estar en una publicada de hace dos meses y en una programada para
# manana, y liberarlo dejaria a la segunda sin nada que publicar.
app.media.release-after-days=${MEDIA_RELEASE_AFTER_DAYS:30}
app.media.release-batch-size=${MEDIA_RELEASE_BATCH_SIZE:50}
app.media.release-cron=${MEDIA_RELEASE_CRON:0 10 4 * * *}

# Barrida de las imagenes que ffmpeg adapto para cada red (ver mas abajo). No
# tienen fila en media_assets ni cuentan para la cuota de nadie, pero ocupan en
# R2 y se pagan. Borrarlas al borrar el original ya lo hace MediaService; esto
# recoge lo que aquello no alcanza: lo acumulado antes de que existiera esta
# limpieza, los derivados de un workspace del que ya no queda ninguna fila, y
# las claves del formato plano anterior.
#
# De madrugada porque es una barrida del bucket entero. Son archivos
# regenerables —si se borra uno de mas, la siguiente publicacion lo rehace—,
# asi que puede permitirse ser tajante.
app.media.derivados-cleanup-cron=${MEDIA_DERIVADOS_CLEANUP_CRON:0 40 3 * * *}

# ---------------------------------------------------------------------------
# Adaptar la imagen a la red (ffmpeg)
# ---------------------------------------------------------------------------
# Cada red acepta una cosa distinta y la mas estricta con diferencia es
# Instagram por API: solo JPEG, entre 4:5 y 1.91:1, hasta 1440 px y 8 MB. Una
# foto vertical normal de telefono es 3:4 o 9:16, asi que no cabe.
#
# Antes esto lo pagaba la persona: la app le enseñaba dos botones, "Recortar" o
# "Rellenar", y la obligaba a elegir entre perder encuadre o ganar franjas
# blancas. Ahora lo hace ffmpeg al publicar, cuando ya se sabe a que redes va,
# y sin perder nada de la foto: lo que le falta al lienzo se rellena con la
# propia foto ampliada y desenfocada.
#
# Con enabled=false se publica la imagen tal como se subio. Si ffmpeg no esta
# instalado no hace falta apagarlo a mano: al fallar se publica la original.
app.media.adapt.enabled=${MEDIA_ADAPT_ENABLED:true}

# Nombre suelto = se busca en el PATH. En un contenedor conviene la ruta fija
# (/usr/bin/ffmpeg) y apt-get install ffmpeg en la imagen.
app.media.adapt.ffmpeg=${FFMPEG_PATH:ffmpeg}
app.media.adapt.ffprobe=${FFPROBE_PATH:ffprobe}

# Una foto tarda menos de un segundo. El tope esta para que un archivo raro no
# deje un proceso colgado ocupando un worker de la cola de publicacion.
app.media.adapt.timeout-seconds=${MEDIA_ADAPT_TIMEOUT_SECONDS:45}

# Calidad JPEG en la escala de ffmpeg (-q:v): 2 es la mejor, 31 la peor.
app.media.adapt.calidad=${MEDIA_ADAPT_QUALITY:3}

# Cuanto se desenfoca el fondo que rellena. Menos se lee como una segunda foto
# mal puesta; asi se lee como un fondo.
app.media.adapt.desenfoque=${MEDIA_ADAPT_BLUR:28}
app.media.adapt.max-bytes-entrada=${MEDIA_ADAPT_MAX_INPUT_BYTES:83886080}

# ---------------------------------------------------------------------------
# Correo saliente (Resend por SMTP)
# ---------------------------------------------------------------------------
# El servidor, el usuario, la llave y el remitente son de cada ambiente (ver
# spring.mail y app.mail en los perfiles). Aqui solo lo que es igual en todos:
# la autenticacion, TLS obligatorio y topes cortos a proposito: el envio corre
# aparte (@Async), pero un SMTP que no contesta no debe dejar un hilo colgado.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---------------------------------------------------------------------------
# Topes de la plataforma (semillas de app_limits; ver arriba)
# ---------------------------------------------------------------------------
# Las cuotas por red protegen la pagina de cada cliente y al proveedor. Estos
# protegen a la plataforma de un cliente —o un bug— que cree mil
# publicaciones, las deje todas pendientes o llame a la IA en bucle.
#
# Publicaciones que un workspace puede tener esperando salir (en cola o
# programadas). Es lo que impide la pila infinita.
app.limits.max-pending-posts=${LIMITS_MAX_PENDING_POSTS:200}
# Publicaciones que un workspace puede crear en un dia natural.
app.limits.max-posts-per-day=${LIMITS_MAX_POSTS_PER_DAY:120}
# Llamadas a la IA por workspace y dia. Cada una se paga en OpenAI.
app.limits.max-ai-calls-per-day=${LIMITS_MAX_AI_CALLS_PER_DAY:200}
# Imagenes de campana por workspace y dia (cada una cuesta dinero en OpenAI).
app.limits.max-image-generations-per-day=${LIMITS_MAX_IMAGE_GENERATIONS_PER_DAY:10}
# Cuanto se pausa la cola ENTERA cuando upload-post contesta 429 sin decir
# cuanto esperar. Ver ProviderCircuitBreaker.
app.limits.provider-pause-seconds=${LIMITS_PROVIDER_PAUSE_SECONDS:300}
# Horas de la ventana movil de Meta (25 en 24 h corridas). Ademas del contador
# por dia natural se comprueba lo publicado en las ultimas N horas. 0 = no.
app.limits.rolling-window-hours=${LIMITS_ROLLING_WINDOW_HOURS:24}
# Publicaciones al dia de TODA la plataforma, sumando workspaces. 0 = sin tope:
# el plan Professional de upload-post no limita subidas, asi que hoy no hace
# falta; queda para el dia que el plan cambie.
app.limits.global-daily-publishes=${LIMITS_GLOBAL_DAILY_PUBLISHES:0}

# ---------------------------------------------------------------------------
# Cobros (Stripe)
# ---------------------------------------------------------------------------
# Las llaves (app.stripe) van en el perfil de cada ambiente. Los precios, los
# dias de prueba y demas ajustes de cobro viven en la tabla billing_settings.

# ---------------------------------------------------------------------------
# Comentarios
# ---------------------------------------------------------------------------
# upload-post no tiene webhook de comentarios, asi que hay que preguntar. El
# tope de upload-post es por LLAVE y lo comparte con publicar: por eso se
# pregunta poco y solo por lo que creció. Ver ComentariosWorker.
app.comentarios.enabled=${COMENTARIOS_ENABLED:true}
# Publicaciones que se revisan por vuelta.
app.comentarios.por-vuelta=${COMENTARIOS_POR_VUELTA:40}
# Antiguedad maxima de una publicacion para seguir mirandole comentarios.
app.comentarios.dias=${COMENTARIOS_DIAS:30}
# Pausa entre una publicacion y la siguiente, para no ir en ráfaga.
app.comentarios.pausa-ms=${COMENTARIOS_PAUSA_MS:1500}
# Cada cuanto corre la vuelta, y cuanto espera al arrancar (despues de que la
# cola de publicacion ya se acomodó).
app.comentarios.delay-ms=${COMENTARIOS_DELAY_MS:600000}
app.comentarios.initial-delay-ms=${COMENTARIOS_INITIAL_DELAY_MS:420000}
# Avisos al telefono. Todo esto existe para NO avisar de mas: uno agrupado por
