# Solo en pruebas (se suma a la configuración normal, no la reemplaza).
#
# La edición automática de videos (subtítulos, música, recorte) corre de fondo
# cada 30 s. Con la música encendida de entrada, todo video que crea una prueba
# queda esperando su edición, y esa vuelta arrancaba en medio de otras pruebas:
# tocaba sus simuladores desde otro hilo y las hacía fallar al azar. Las pruebas
# de la edición la llaman a mano (procesar), así que aquí se apaga.
app.subtitulos.vuelta-inicial-ms=86400000
app.subtitulos.vuelta-ms=86400000
